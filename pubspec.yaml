name: tech_tan
description: "ITパスポート・基本情報技術者・応用情報技術者のための単語帳＆過去問アプリ「テク単」"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# versionName+versionCode。versionCode は Play へアップロード済みの値より
# 大きくする必要がある。
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0-dev.3
  riverpod_annotation: ^3.0.0-dev.3
  shared_preferences: ^2.5.3
  intl: ^0.17.0
  table_calendar: ^3.0.8
  math_expressions: ^2.1.1
  url_launcher: ^6.1.7
  flutter_phoenix: ^1.1.1
  share_plus: ^11.0.0 # 13.x は現行の Flutter/AGP でプラグイン側の Kotlin がコンパイルできないため据え置き
  path_provider: ^2.1.5
  google_mobile_ads: ^9.0.0
  http: ^0.13.5
  xml: ^6.1.0
  webview_flutter: ^4.2.2
  webview_flutter_android: ^4.2.2
  html: ^0.15.0
  flutter_launcher_icons: ^0.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.6
  build_runner:
  custom_lint:
  riverpod_generator: ^3.0.0-dev.11
  riverpod_lint: ^3.0.0-dev.4

# アイコン／スプラッシュ用の画像は未配置のため、生成設定はコメントアウトしている。
# assets/images/ に tech_tan.png / splash.png を置いたうえで
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
# を実行すると有効化できる。
#
# flutter_launcher_icons:
#   android: true
#   ios: true
#   image_path_android: "assets/images/tech_tan.png"
#   image_path_ios: "assets/images/tech_tan.png"
#   adaptive_icon_foreground: "assets/images/tech_tan.png"
#   adaptive_icon_background: "#0B63CE"
#
# flutter_native_splash:
#   color: '#ffffff'
#   image: 'assets/images/splash.png'
#   fullscreen: true

flutter:
  uses-material-design: true

  fonts:
    - family: Murecho
      fonts:
        - asset: assets/fonts/Murecho/static/Murecho-Thin.ttf
          weight: 100
        - asset: assets/fonts/Murecho/static/Murecho-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Murecho/static/Murecho-Light.ttf
          weight: 300
        - asset: assets/fonts/Murecho/static/Murecho-Regular.ttf
          weight: 400
        - asset: assets/fonts/Murecho/static/Murecho-Medium.ttf
          weight: 500
        - asset: assets/fonts/Murecho/static/Murecho-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Murecho/static/Murecho-Bold.ttf
          weight: 700
        - asset: assets/fonts/Murecho/static/Murecho-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Murecho/static/Murecho-Black.ttf
          weight: 900

